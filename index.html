<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07101f" />
    <title>午前0時の終着駅</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game" aria-label="午前0時の終着駅">
      <section id="orientation-message" aria-live="polite">
        <div>
          <p class="orientation-icon">↻</p>
          <h1>スマホを横向きにしてください</h1>
          <p>『午前0時の終着駅』は横画面で遊べます。</p>
        </div>
      </section>
      <section id="title-screen" class="screen">
        <div class="title-content">
          <p class="eyebrow">INTERACTIVE NOVEL</p>
          <h1>午前0時の終着駅</h1>
          <p class="subtitle">存在しない終電に、乗ってしまった。</p>
          <button id="start-button" class="primary-button">はじめる</button>
          <button id="continue-button" class="text-button" hidden>つづきから</button>
        </div>
      </section>
      <section id="story-screen" class="screen" hidden>
        <div id="background" class="background-layer is-visible" role="img" aria-label="雨の駅ホーム"></div>
        <div id="background-next" class="background-layer" aria-hidden="true"></div>
        <div id="rain-layer" class="rain-layer" aria-hidden="true"></div>
        <div class="vignette"></div>
        <div id="event-cg-layer" class="event-cg-layer" aria-hidden="true"><img id="event-cg-image" alt="" /></div>
        <div id="chapter-label" class="chapter-label"></div>
        <div id="character-stage" aria-hidden="true">
          <div class="character character-hidden" data-position="left"><div class="character-placeholder">?</div></div>
          <div class="character character-hidden" data-position="center"><div class="character-placeholder">?</div></div>
          <div class="character character-hidden" data-position="right"><div class="character-placeholder">?</div></div>
        </div>
        <header class="game-header">
          <button id="menu-button" class="icon-button" aria-label="メニュー">☰</button>
          <button id="log-button" class="icon-button" aria-label="会話履歴">LOG</button>
          <button id="auto-button" class="icon-button" aria-pressed="false">AUTO</button>
        </header>
        <div id="tap-hint" class="tap-hint">タップして進む</div>
        <section id="dialogue-box" class="dialogue-box" aria-live="polite">
          <p id="speaker" class="speaker"></p><p id="dialogue" class="dialogue"></p><span class="next-mark">◆</span>
        </section>
        <section id="choices" class="choices" aria-label="選択肢"></section>
      </section>
      <dialog id="menu-dialog"><div class="menu-content"><h2>メニュー</h2><button id="restart-button" class="menu-button">最初から</button><button id="close-menu-button" class="menu-button secondary">戻る</button></div></dialog>
      <dialog id="log-dialog" aria-label="会話履歴"><div class="log-content"><div class="log-heading"><h2>会話履歴</h2><button id="close-log-button" class="icon-button" aria-label="閉じる">×</button></div><div id="log-list" class="log-list"></div></div></dialog>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
