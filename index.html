<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数当てゲーム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #172554;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 38px 30px;
      border-radius: 24px;
      text-align: center;
      background: #fff;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .28);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    .description { margin: 0 0 24px; color: #475569; }
    .message {
      min-height: 54px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      padding: 12px;
      border-radius: 12px;
      background: #eef2ff;
      font-weight: 700;
    }
    form { display: flex; gap: 10px; justify-content: center; }
    input {
      width: 130px;
      padding: 12px;
      border: 2px solid #c7d2fe;
      border-radius: 10px;
      font-size: 1.1rem;
      text-align: center;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }
    button:hover { background: #4338ca; }
    .count { margin: 22px 0 0; color: #64748b; font-size: .95rem; }
    .restart { margin-top: 18px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 数当てゲーム</h1>
    <p class="description">1〜100の数字を当てよう！</p>
    <p id="message" class="message" aria-live="polite">1〜100の数字を当ててください！</p>

    <form id="guess-form">
      <label for="guess" class="hidden">予想した数字</label>
      <input id="guess" type="number" min="1" max="100" required autofocus placeholder="数字">
      <button type="submit">予想する</button>
    </form>

    <button id="restart" class="restart hidden" type="button">もう一度遊ぶ</button>
    <p id="count" class="count">挑戦回数：0回</p>
  </main>

  <script>
    const form = document.querySelector("#guess-form");
    const input = document.querySelector("#guess");
    const message = document.querySelector("#message");
    const countText = document.querySelector("#count");
    const restart = document.querySelector("#restart");

    let answer;
    let count;

    function startGame() {
      answer = Math.floor(Math.random() * 100) + 1;
      count = 0;
      message.textContent = "1〜100の数字を当ててください！";
      countText.textContent = "挑戦回数：0回";
      form.classList.remove("hidden");
      restart.classList.add("hidden");
      input.value = "";
      input.focus();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const guess = Number(input.value);

      if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
        message.textContent = "1〜100の整数を入力してください。";
        return;
      }

      count += 1;
      countText.textContent = `挑戦回数：${count}回`;

      if (guess > answer) {
        message.textContent = `${guess} は大きすぎます。もっと小さい！`;
      } else if (guess < answer) {
        message.textContent = `${guess} は小さすぎます。もっと大きい！`;
      } else {
        message.textContent = `🎉 正解！ ${count}回で当たりました！`;
        form.classList.add("hidden");
        restart.classList.remove("hidden");
      }

      input.value = "";
      input.focus();
    });

    restart.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
