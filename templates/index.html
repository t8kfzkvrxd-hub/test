<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数当てゲーム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #172554;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 38px 30px;
      border-radius: 24px;
      text-align: center;
      background: #fff;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .28);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .description { margin: 0 0 24px; color: #475569; }
    .message {
      min-height: 54px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      padding: 12px;
      border-radius: 12px;
      background: #eef2ff;
      font-weight: 700;
    }
    form { display: flex; gap: 10px; justify-content: center; }
    input {
      width: 130px;
      padding: 12px;
      border: 2px solid #c7d2fe;
      border-radius: 10px;
      font-size: 1.1rem;
      text-align: center;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }
    button:hover { background: #4338ca; }
    .count { margin: 22px 0 0; color: #64748b; font-size: .95rem; }
    .restart { margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 数当てゲーム</h1>
    <p class="description">1〜100の数字を当てよう！</p>
    <p class="message" aria-live="polite">{{ message }}</p>

    {% if game_over %}
      <form class="restart" action="{{ url_for('restart') }}" method="post">
        <button type="submit">もう一度遊ぶ</button>
      </form>
    {% else %}
      <form action="{{ url_for('home') }}" method="post">
        <label for="guess" class="sr-only">予想した数字</label>
        <input id="guess" name="guess" type="number" min="1" max="100" required autofocus placeholder="数字">
        <button type="submit">予想する</button>
      </form>
    {% endif %}

    <p class="count">挑戦回数：{{ count }}回</p>
  </main>
</body>
</html>
